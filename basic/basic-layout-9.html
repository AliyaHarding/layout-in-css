<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Layout 9</title>
    <link rel="stylesheet" href="../style.css">
    <style>
      /* Doe hier jouw ding! */
      body{
        display: grid;
        gap: 1em;
        grid-template-columns: 1fr 5fr;
        grid-template-rows: 1fr 4fr 1fr;
        grid-template-areas: "header nav"
        "main main"
        "footer footer";

        header{
          grid-area: header;
        }

        nav{
          grid-area: nav;
          display: flex;
          justify-content: space-around;
          gap: 5px;
          align-items: center;
        }

        main{
          grid-area: main;
        }
        footer{
          grid-area: footer;
        }
      }
    </style>
  </head>
  <body id="basic-layout-9">
    <header><h1>Basic Layout 9</h1></header>
    <nav>
      <a href="#">Home</a>
      <a href="#">Over ons</a>
      <a href="#">Contact</a>
    </nav>
    <main><a href="../index.html">Terug naar het overzicht</a></main>
    <footer></footer>
  </body>
</html>
